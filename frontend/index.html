<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME%</title>
    <script src="%BASE_URL%theme-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (
          typeof window.EXCALIDRAW_ASSET_PATH === "string" &&
          window.EXCALIDRAW_ASSET_PATH.length > 0
        )
          return;
        var base = "%BASE_URL%";
        if (base === "%BASE_URL%") base = "/";
        if (base && base[base.length - 1] !== "/") base += "/";
        window.EXCALIDRAW_ASSET_PATH = new URL(
          base || "/",
          window.location.origin,
        ).toString();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
